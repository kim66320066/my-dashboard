<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>영업 대시보드</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{
    --blue:#2563eb; --blue-mid:#93c5fd; --blue-light:#dbeafe; --blue-bg:#eff6ff;
    --text:#111827; --sub:#6b7280; --line:#e5e7eb; --bg:#ffffff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--text);line-height:1.4;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1280px;margin:0 auto;padding:28px 24px 48px}
  header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:20px;flex-wrap:wrap}
  h1{font-size:24px;font-weight:700;letter-spacing:-0.02em}
  .updated{font-size:13px;color:var(--sub)}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px}
  .card h2{font-size:15px;font-weight:600;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
  .muted{color:var(--sub);font-size:13px;font-weight:400}

  /* KPI */
  .kpis{display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr;gap:14px;margin-bottom:14px}
  .kpi .label{font-size:13px;color:var(--sub);margin-bottom:8px}
  .kpi .value{font-size:26px;font-weight:700;letter-spacing:-0.02em;word-break:keep-all}
  .kpi.main{background:var(--blue-bg);border-color:var(--blue-light)}
  .kpi.main .value{font-size:36px;color:var(--blue)}
  .kpi .foot{font-size:13px;color:var(--sub);margin-top:8px}
  .kpi .foot b{color:var(--text);font-weight:600}
  .progress{height:10px;background:#fff;border:1px solid var(--blue-light);border-radius:99px;overflow:hidden;margin-top:12px}
  .progress > div{height:100%;background:var(--blue);border-radius:99px;width:0;transition:width .8s ease}
  .progress-row{display:flex;justify-content:space-between;font-size:13px;margin-top:6px;color:var(--sub)}
  .progress-row b{color:var(--blue)}

  /* grids */
  .row{display:grid;grid-template-columns:3fr 2fr;gap:14px;margin-bottom:14px}
  .row.half{grid-template-columns:1fr 1fr}

  /* monthly chart */
  .legend{display:flex;gap:14px;font-size:12px;color:var(--sub);font-weight:400}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .sw{width:12px;height:12px;border-radius:3px;display:inline-block}
  .sw.dash{width:16px;height:0;border-top:2px dashed var(--blue);border-radius:0}
  #monthly{width:100%}
  #monthly svg{display:block;width:100%}

  /* funnel */
  .funnel{display:flex;flex-direction:column;align-items:center}
  .stage{width:100%;display:flex;flex-direction:column;align-items:center}
  .stage-bar{height:44px;border-radius:8px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;color:#fff;font-size:14px;min-width:150px;transition:width .8s ease}
  .stage-bar .n{font-weight:700}
  .conv{font-size:12px;color:var(--sub);padding:5px 0;display:flex;align-items:center;gap:4px}
  .conv b{color:var(--blue);font-weight:600}
  .final{margin-top:16px;width:100%;border-top:1px solid var(--line);padding-top:14px;display:flex;justify-content:space-between;align-items:baseline}
  .final .v{font-size:24px;font-weight:700;color:var(--blue)}

  /* rank */
  .rank-item{display:grid;grid-template-columns:26px 90px 1fr auto;align-items:center;gap:10px;padding:8px 0}
  .rank-item + .rank-item{border-top:1px solid #f3f4f6}
  .rank-no{font-size:13px;font-weight:700;color:var(--sub);text-align:center}
  .rank-item:first-child .rank-no{color:var(--blue)}
  .rank-name{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rank-track{height:10px;background:#f3f4f6;border-radius:99px;overflow:hidden}
  .rank-fill{height:100%;background:var(--blue-mid);border-radius:99px;width:0;transition:width .8s ease}
  .rank-item:first-child .rank-fill{background:var(--blue)}
  .rank-amt{font-size:14px;font-weight:600;text-align:right;min-width:80px}

  .msg{padding:40px 0;text-align:center;color:var(--sub);font-size:14px}
  .error{background:#fef2f2;color:#b91c1c;border:1px solid #fecaca;border-radius:10px;padding:14px 16px;font-size:14px;margin-bottom:14px;display:none}

  /* responsive */
  @media (max-width:1024px){
    .kpis{grid-template-columns:1fr 1fr}
    .row{grid-template-columns:1fr}
  }
  @media (max-width:640px){
    .wrap{padding:18px 14px 36px}
    h1{font-size:20px}
    .kpis{grid-template-columns:1fr 1fr;gap:10px}
    .kpi.main{grid-column:1 / -1}
    .kpi .value{font-size:20px}
    .kpi.main .value{font-size:30px}
    .card{padding:16px}
    .row.half{grid-template-columns:1fr}
    .rank-item{grid-template-columns:22px 70px 1fr auto;gap:8px}
    .rank-amt{min-width:64px;font-size:13px}
    .legend{gap:10px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>영업 대시보드</h1>
    <div class="updated" id="updated">불러오는 중…</div>
  </header>

  <div class="error" id="error"></div>

  <!-- 1. KPI 카드 -->
  <section class="kpis">
    <div class="card kpi main">
      <div class="label">이번 달 매출 <span id="curMonth"></span></div>
      <div class="value" id="kRevenue">-</div>
      <div class="progress"><div id="kBar"></div></div>
      <div class="progress-row"><span>목표 대비 달성률</span><b id="kRate">-</b></div>
    </div>
    <div class="card kpi">
      <div class="label">이번 달 목표</div>
      <div class="value" id="kTarget">-</div>
      <div class="foot" id="kRemain">-</div>
    </div>
    <div class="card kpi">
      <div class="label">객단가</div>
      <div class="value" id="kAvg">-</div>
      <div class="foot">매출 ÷ 계약 건수</div>
    </div>
    <div class="card kpi">
      <div class="label">계약 건수</div>
      <div class="value" id="kDeals">-</div>
      <div class="foot" id="kDealsStage">영업 단계 마지막</div>
    </div>
  </section>

  <!-- 2, 3. 월별 매출 + 깔때기 -->
  <section class="row">
    <div class="card">
      <h2>월별 매출
        <span class="legend">
          <span><i class="sw" style="background:var(--blue-mid)"></i>매출</span>
          <span><i class="sw" style="background:var(--blue)"></i>이번 달</span>
          <span><i class="sw dash"></i>목표</span>
        </span>
      </h2>
      <div id="monthly"><div class="msg">불러오는 중…</div></div>
    </div>
    <div class="card">
      <h2>영업 단계</h2>
      <div class="funnel" id="funnel"><div class="msg">불러오는 중…</div></div>
    </div>
  </section>

  <!-- 4, 5. 순위 -->
  <section class="row half">
    <div class="card">
      <h2>담당자별 순위 <span class="muted">매출 기준</span></h2>
      <div id="rankPerson"><div class="msg">불러오는 중…</div></div>
    </div>
    <div class="card">
      <h2>상품별 순위 <span class="muted">매출 기준</span></h2>
      <div id="rankProduct"><div class="msg">불러오는 중…</div></div>
    </div>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // ===== 연결 정보 =====
  const SUPABASE_URL = 'https://krgctviqkasulxkruzvd.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_uWalUkHncbfpwjnmbJyaDQ_PKuB29Yr';
  const UNIT = '원';   // 금액 단위 표시 (필요하면 '만원' 등으로 바꾸세요)

  const { createClient } = supabase;
  const db = createClient(SUPABASE_URL, SUPABASE_KEY);

  // ===== 도우미 =====
  const $ = id => document.getElementById(id);
  const num = v => Number(v) || 0;
  const fmt = v => Math.round(num(v)).toLocaleString('ko-KR');
  const money = v => fmt(v) + UNIT;
  const pct = (a, b) => (num(b) ? (num(a) / num(b)) * 100 : 0);
  const pctText = v => v.toFixed(1) + '%';
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function short(v){ // 축/막대 라벨용 짧은 금액
    v = num(v); const a = Math.abs(v);
    if (a >= 1e8) return +(v/1e8).toFixed(1) + '억';
    if (a >= 1e4) return +(v/1e4).toFixed(a >= 1e6 ? 0 : 1) + '만';
    return fmt(v);
  }

  let monthly = [], pipeline = [];

  // ===== 데이터 불러오기 =====
  async function load(){
    try{
      const [m, p, r] = await Promise.all([
        db.from('sales_monthly').select('sort_order, month, revenue, target').order('sort_order', { ascending: true }),
        db.from('sales_pipeline').select('sort_order, stage, count').order('sort_order', { ascending: true }),
        db.from('sales_rank').select('kind, name, amount').order('amount', { ascending: false })
      ]);
      const err = m.error || p.error || r.error;
      if (err) throw err;

      monthly  = m.data || [];
      pipeline = p.data || [];
      const rank = r.data || [];

      renderKpis();
      drawMonthly();
      renderFunnel();
      renderRank('rankPerson',  rank.filter(x => x.kind === 'person'));
      renderRank('rankProduct', rank.filter(x => x.kind === 'product'));

      const now = new Date();
      $('updated').textContent = '업데이트 ' + now.toLocaleString('ko-KR', { dateStyle:'medium', timeStyle:'short' });
    }catch(e){
      $('error').style.display = 'block';
      $('error').textContent = '데이터를 불러오지 못했습니다: ' + (e.message || e);
      $('updated').textContent = '';
      ['monthly','funnel','rankPerson','rankProduct'].forEach(id => $(id).innerHTML = '<div class="msg">데이터 없음</div>');
    }
  }

  // ===== 1. KPI =====
  function renderKpis(){
    const cur = monthly[monthly.length - 1] || {};
    const revenue = num(cur.revenue), target = num(cur.target);
    const last = pipeline[pipeline.length - 1] || {};
    const deals = num(last.count);
    const rate = pct(revenue, target);
    const remain = target - revenue;

    $('curMonth').textContent = cur.month ? '(' + cur.month + ')' : '';
    $('kRevenue').textContent = money(revenue);
    $('kRate').textContent = pctText(rate);
    requestAnimationFrame(() => $('kBar').style.width = Math.min(rate, 100) + '%');

    $('kTarget').textContent = money(target);
    $('kRemain').innerHTML = remain > 0
      ? '남은 금액 <b>' + money(remain) + '</b>'
      : '목표 달성 <b style="color:var(--blue)">+' + money(-remain) + '</b>';

    $('kAvg').textContent = deals ? money(revenue / deals) : '-';
    $('kDeals').textContent = fmt(deals) + '건';
    if (last.stage) $('kDealsStage').textContent = '\'' + last.stage + '\' 단계 기준';
  }

  // ===== 2. 월별 매출 막대그래프 (SVG) =====
  function drawMonthly(){
    const box = $('monthly');
    if (!monthly.length){ box.innerHTML = '<div class="msg">데이터 없음</div>'; return; }

    const W = Math.max(box.clientWidth, 280);
    const small = W < 500;
    const H = small ? 240 : 300;
    const pad = { l: small ? 40 : 52, r: 8, t: 22, b: 30 };
    const cw = W - pad.l - pad.r, ch = H - pad.t - pad.b;
    const n = monthly.length;

    const maxV = Math.max(...monthly.map(d => Math.max(num(d.revenue), num(d.target))), 1) * 1.12;
    const y = v => pad.t + ch - (num(v) / maxV) * ch;
    const slot = cw / n;
    const bw = Math.min(slot * 0.62, 48);
    const fs = small ? 10 : 12;

    let s = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="월별 매출 막대그래프">`;

    // 가로 눈금선
    for (let i = 0; i <= 4; i++){
      const v = maxV / 1.12 * i / 4, yy = y(v);
      s += `<line x1="${pad.l}" x2="${W - pad.r}" y1="${yy}" y2="${yy}" stroke="#f3f4f6"/>`;
      s += `<text x="${pad.l - 6}" y="${yy + 4}" text-anchor="end" font-size="${fs}" fill="#9ca3af">${short(v)}</text>`;
    }

    // 막대
    monthly.forEach((d, i) => {
      const isCur = i === n - 1;
      const x = pad.l + slot * i + (slot - bw) / 2;
      const top = y(d.revenue), h = pad.t + ch - top;
      s += `<rect x="${x}" y="${top}" width="${bw}" height="${Math.max(h, 0)}" rx="4" fill="${isCur ? 'var(--blue)' : 'var(--blue-mid)'}"><title>${esc(d.month)}: ${money(d.revenue)} / 목표 ${money(d.target)}</title></rect>`;
      if (isCur || !small){
        s += `<text x="${x + bw/2}" y="${top - 6}" text-anchor="middle" font-size="${fs}" font-weight="${isCur ? 700 : 400}" fill="${isCur ? 'var(--blue)' : '#6b7280'}">${short(d.revenue)}</text>`;
      }
      // 월 라벨 (칸이 좁으면 건너뛰기)
      const step = slot < 26 ? Math.ceil(26 / slot) : 1;
      if (i % step === 0 || isCur){
        s += `<text x="${pad.l + slot * i + slot/2}" y="${H - 10}" text-anchor="middle" font-size="${fs}" fill="${isCur ? 'var(--blue)' : '#6b7280'}" font-weight="${isCur ? 700 : 400}">${esc(d.month)}</text>`;
      }
    });

    // 목표 점선 (월별 목표가 다르면 계단 모양)
    let path = '';
    monthly.forEach((d, i) => {
      const x0 = pad.l + slot * i, x1 = x0 + slot, yy = y(d.target);
      path += (i === 0 ? `M${x0},${yy}` : `L${x0},${yy}`) + `L${x1},${yy}`;
    });
    s += `<path d="${path}" fill="none" stroke="var(--blue)" stroke-width="1.5" stroke-dasharray="5 4"/>`;

    s += `<line x1="${pad.l}" x2="${W - pad.r}" y1="${pad.t + ch}" y2="${pad.t + ch}" stroke="#d1d5db"/>`;
    s += `</svg>`;
    box.innerHTML = s;
  }

  // ===== 3. 영업 단계 깔때기 =====
  function renderFunnel(){
    const box = $('funnel');
    if (!pipeline.length){ box.innerHTML = '<div class="msg">데이터 없음</div>'; return; }

    const first = num(pipeline[0].count);
    const maxC = Math.max(...pipeline.map(d => num(d.count)), 1);
    const shades = ['#1e40af','#1d4ed8','#2563eb','#3b82f6','#60a5fa','#93c5fd'];
    let h = '';

    pipeline.forEach((d, i) => {
      if (i > 0){
        const r = pct(d.count, pipeline[i - 1].count);
        h += `<div class="conv">↓ 전환율 <b>${pctText(r)}</b></div>`;
      }
      const w = Math.max(num(d.count) / maxC * 100, 40);
      const color = shades[Math.min(Math.round(i * (shades.length - 1) / Math.max(pipeline.length - 1, 1)), shades.length - 1)];
      h += `<div class="stage"><div class="stage-bar" style="width:${w}%;background:${color};color:${color === '#93c5fd' || color === '#60a5fa' ? '#0f172a' : '#fff'}">
              <span>${esc(d.stage)}</span><span class="n">${fmt(d.count)}건</span></div></div>`;
    });

    const last = num(pipeline[pipeline.length - 1].count);
    h += `<div class="final"><span class="muted">최종 전환율 (${esc(pipeline[pipeline.length-1].stage)} ÷ ${esc(pipeline[0].stage)})</span>
          <span class="v">${pctText(pct(last, first))}</span></div>`;
    box.innerHTML = h;
  }

  // ===== 4, 5. 순위 =====
  function renderRank(id, list){
    const box = $(id);
    if (!list.length){ box.innerHTML = '<div class="msg">데이터 없음</div>'; return; }
    const max = Math.max(...list.map(d => num(d.amount)), 1);
    box.innerHTML = list.map((d, i) => `
      <div class="rank-item">
        <div class="rank-no">${i + 1}</div>
        <div class="rank-name" title="${esc(d.name)}">${esc(d.name)}</div>
        <div class="rank-track"><div class="rank-fill" data-w="${num(d.amount) / max * 100}"></div></div>
        <div class="rank-amt">${short(d.amount)}${/^[0-9,]+$/.test(short(d.amount)) ? UNIT : ''}</div>
      </div>`).join('');
    requestAnimationFrame(() => box.querySelectorAll('.rank-fill').forEach(el => el.style.width = el.dataset.w + '%'));
  }

  // 화면 크기 바뀌면 그래프 다시 그리기
  let t;
  window.addEventListener('resize', () => { clearTimeout(t); t = setTimeout(drawMonthly, 150); });

  load();
</script>
</body>
</html>
